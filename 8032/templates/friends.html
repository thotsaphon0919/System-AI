{% extends "base.html" %}
{% block content %}

<style>
.friends-wrap{
  max-width:760px;
  margin:auto;
  padding:18px;
  color:#eef7ff;
}
.friends-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.friends-head a{
  color:#63d7ff;
  text-decoration:none;
}
.friend-search{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(80,190,255,.4);
  background:#09172b;
  color:white;
  margin-bottom:14px;
}
.friend-list{
  display:grid;
  gap:12px;
}
.friend-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(80,190,255,.35);
  background:#0a162a;
}
.friend-info{
  display:flex;
  align-items:center;
  gap:12px;
}
.friend-avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:linear-gradient(135deg,#19bdf3,#8059ff);
}
.friend-status{
  font-size:12px;
  color:#58e6ac;
}
.friend-btn{
  padding:10px 14px;
  border:0;
  border-radius:12px;
  color:white;
  text-decoration:none;
  background:linear-gradient(90deg,#19bdf3,#8059ff);
}
</style>

<main class="friends-wrap">
  <div class="friends-head">
    <div>
      <small>INFINI NEXUS HUB</small>
      <h2>หน้ารวมเพื่อน</h2>
    </div>
    <a href="/control-room">← กลับห้องควบคุม</a>
  </div>

  <input class="friend-search" placeholder="ค้นหาเพื่อน">

  <section class="friend-list">
    <div class="friend-card">
      <div class="friend-info">
        <a href="/control-room" style="text-decoration:none;">
  <img
    src="/static/images/default-avatar.svg"
    class="friend-avatar"
    alt="เพื่อนคนที่ 1"
  >
</a>
        <div>
          <strong>เพื่อนคนที่ 1</strong>
          <div class="friend-status">ออนไลน์</div>
        </div>
      </div>
      <a class="friend-btn" href="/control-room">เปิดแชท</a>
    </div>

    <div class="friend-card">
      <div class="friend-info">
        <a href="/control-room" style="text-decoration:none;">
  <img
    src="/static/images/default-avatar.svg"
    class="friend-avatar"
    alt="เพื่อนคนที่ 2"
  >
</a>
        <div>
          <strong>เพื่อนคนที่ 2</strong>
          <div class="friend-status">ออฟไลน์</div>
        </div>
      </div>
      <a class="friend-btn" href="/control-room">เปิดแชท</a>
    </div>
  </section>
</main>

{% endblock %}
